name: Deploy Backend to GCP Cloud Run on Tag Push

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Debug Environment Variables
        run: |
          echo "Checking Project ID length: ${#GCP_PROJECT_ID}"
          echo "GCP Region: ${{ secrets.GCP_REGION }}"
          echo "App Name: ${{ secrets.APP_NAME }}"
          echo "GAR Repo: ${{ secrets.GCP_GAR_REPO }}"
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Extract Tag Name
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="${{ secrets.GCP_GAR_REPO }}/${{ secrets.APP_NAME }}"
          IMAGE_LATEST="${{ secrets.GCP_GAR_REPO }}/${{ secrets.APP_NAME }}:latest"

          docker build -t $IMAGE_URI -t $IMAGE_LATEST .
          docker push $IMAGE_URI
          docker push $IMAGE_LATEST

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ secrets.APP_NAME }} \
            --image=${{ secrets.GCP_GAR_REPO }}/${{ secrets.APP_NAME }} \
            --region=${{ secrets.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars "\
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }},\
          MONGODB_URI=${{ secrets.MONGODB_URI }},\
          PROJECT_NAME=${{ secrets.PROJECT_NAME }},\
          ENVIRONMENT=${{ secrets.ENVIRONMENT }},\
          MONGODB_DB_NAME=${{ secrets.MONGODB_DB_NAME }},\
          LLM_MODEL_NAME=${{ secrets.LLM_MODEL_NAME }},\
          EMBEDDING_MODEL_NAME=${{ secrets.EMBEDDING_MODEL_NAME }},\
          GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},\
          GCP_REGION=${{ secrets.GCP_REGION }},\
          PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }},\
          PINECONE_INDEX_NAME=${{ secrets.PINECONE_INDEX_NAME }},\
          PINECONE_DIMENSION=${{ secrets.PINECONE_DIMENSION }}"
